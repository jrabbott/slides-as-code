name: Build
description: Install dependencies, audit, build, and smoke-check dist. Callers must check out the repo first.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  base-path:
    description: Vite base path for project Pages (e.g. /my-talk/). Defaults to /<repository-name>/.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Audit dependencies
      run: npm run audit
      shell: bash

    - name: Resolve Vite base path
      id: base
      run: |
        if [ -n "${{ inputs.base-path }}" ]; then
          BASE="${{ inputs.base-path }}"
        else
          BASE="/${{ github.event.repository.name }}/"
        fi
        case "$BASE" in
          */) ;;
          *) BASE="${BASE}/" ;;
        esac
        echo "path=$BASE" >> "$GITHUB_OUTPUT"
        echo "Using Vite base: $BASE"
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
      env:
        BASE_PATH: ${{ steps.base.outputs.path }}

    - name: Smoke check dist
      run: |
        test -f dist/index.html
        grep -q 'assets/' dist/index.html
        ls dist/assets/*.js dist/assets/*.css >/dev/null
        grep -q 'hljs\|highlight\|monokai' dist/assets/*.css
      shell: bash
