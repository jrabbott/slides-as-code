name: Build
description: Install dependencies, audit, build, and smoke-check dist. Callers must check out the repo first.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Audit dependencies
      run: npm run audit
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Smoke check dist
      run: |
        test -f dist/index.html
        grep -q 'assets/' dist/index.html
        ls dist/assets/*.js dist/assets/*.css >/dev/null
      shell: bash
